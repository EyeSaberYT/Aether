[package]
name = "aether"
version = "0.1.0"
description = "Aether - a modern, open-source Minecraft launcher"
authors = ["Aether Contributors"]
edition = "2021"
rust-version = "1.77"
license = "MIT"

# The library is what actually contains the launcher logic so that it can be
# unit tested and reused. `main.rs` is a thin shell around it.
[lib]
name = "aether_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

tokio = { version = "1", features = ["full"] }
futures = "0.3"

# `rustls-tls` keeps the binary self-contained (no OpenSSL dependency on Linux).
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "gzip",
] }

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
md-5 = "0.10"
sha1 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
dirs = "5"
log = "0.4"
walkdir = "2"

[features]
# Enables Tauri's devtools in release builds for local debugging.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
