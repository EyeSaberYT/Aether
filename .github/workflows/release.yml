# Builds signed release bundles for every platform and publishes them as a
# GitHub Release. The Tauri CLI generates `latest.json` (the update manifest the
# in-app updater polls) and signs every bundle with TAURI_SIGNING_PRIVATE_KEY.
#
# Releasing: bump the version in package.json, src-tauri/Cargo.toml and
# src-tauri/tauri.conf.json, then push a tag:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Required repository secret:
#   TAURI_SIGNING_PRIVATE_KEY         — contents of the private key file
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — key password (empty if none)
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: Windows
          - platform: ubuntu-latest
            name: Linux
          - platform: macos-latest
            name: macOS

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ubuntu-latest is just GitHub's Linux build machine — the artifacts it
      # produces (AppImage, deb, rpm) are not tied to Ubuntu.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget \
            file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm
          # Packaging an AppImage runs a small AppImage helper, which needs libfuse.
          # The package was renamed in Ubuntu 24.04 (libfuse2 -> libfuse2t64).
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Linux gets distro-agnostic formats: a universal AppImage that runs on any
          # distribution, plus native deb (Debian/Ubuntu) and rpm (Fedora/RHEL) packages.
          # Other platforms build everything their platform supports.
          args: ${{ matrix.platform == 'ubuntu-latest' && '--bundles deb,rpm,appimage' || '' }}
          # By default the updater manifest points windows-x86_64 at the WiX .msi, even
          # though the download users are told to grab is the NSIS setup.exe. Point it at
          # the NSIS bundle instead: it is the per-user installer (no elevation prompt) and
          # it is the one our passive install mode was written for.
          updaterJsonPreferNsis: true
          # Keep the standalone .sig files off the release page. The updater never fetches
          # them: it verifies the download against the signature embedded in latest.json,
          # which tauri-action still reads from the local build output. The .sig assets are
          # therefore pure clutter for anyone browsing the release.
          uploadUpdaterSignatures: false
          # tauri-action v1 no longer derives the tag from the ref: without tagName
          # it logs "No releaseId or tagName provided, skipping all uploads...".
          tagName: ${{ github.ref_name }}
          releaseName: Aether ${{ github.ref_name }}
          releaseBody: |
            First public release of Aether — a free, open-source, ad-free Minecraft launcher.

            **Install**
            - **Windows:** `Aether_*_x64-setup.exe` (or the `.msi`).
            - **Linux (any distribution):** `Aether_*_amd64.AppImage` — `chmod +x` it and run;
              no installation required. Also published as `.deb` (Debian, Ubuntu, Mint, Pop!_OS)
              and `.rpm` (Fedora, RHEL, openSUSE).
            - **macOS:** the `.dmg`.

            In-app updates are enabled: newer versions are offered automatically from
            Settings → Updates.

            > Windows SmartScreen may warn about unsigned downloads, and macOS Gatekeeper may
            > need right-click → Open. Aether is MIT-licensed and fully open source.
          releaseDraft: false
          prerelease: false
